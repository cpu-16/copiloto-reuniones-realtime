# Copia a config.toml y ajusta
# Motor de transcripción:
#   "nemotron" = NVIDIA Nemotron 3.5 ASR streaming 0.6B (cache-aware, baja latencia,
#                mejor WER en español). Usa .venv-nemotron (NeMo 26.06+). [recomendado]
#   "parakeet" = NVIDIA Parakeet TDT v3 (liviano ~1.3GB). Usa .venv-parakeet. [respaldo]
#   "whisper"  = faster-whisper turbo (~2.9GB). Usa .venv.
engine = "parakeet"

[user]
# Nombres con los que te llaman en reuniones (para detectar "¿me preguntan a mí?")
names = ["Rafael", "Rafa"]
# Idioma por defecto de las respuestas sugeridas
reply_language = "es"
# Quién eres y qué buscas: la IA adapta sus sugerencias a tu rol/estilo.
role = "un participante de la reunión"

[copilot]
enabled = true        # copiloto continuo: resumen + ideas + borrador + alertas
interval_s = 15.0     # cada cuántos s analiza el contexto (más alto = menos cuota)

[audio]
# node-id o nombre del monitor del sink. Descúbrelo con scripts/derisk_audio.py.
# Vacío = se autodetecta el sink por defecto.
target = ""
sample_rate = 16000

[whisper]
model = "turbo"
# Para BAJAR la GPU: realtime_model="tiny"/"base", sube realtime_pause, o
# enable_realtime=false (solo finales, mínima GPU, sin texto fluido en vivo).
realtime_model = "small"
realtime_pause = 0.2
enable_realtime = true
compute_type = "float16"
# "" = autodetecta idioma por frase (reuniones bilingües es/en). "es" lo fuerza.
language = ""
# device: "cuda" (GPU NVIDIA) o "cpu" (sin GPU). En CPU el compute_type se fuerza a
# "int8" automáticamente; usa realtime_model="tiny"/"base" para que vaya en tiempo real.
device = "cuda"

[parakeet]
# Umbral RMS (escala int16) para detectar voz. Si el audio del sink viene bajo y no
# transcribe NADA, este suele ser el culpable. (Solo aplica al engine "parakeet";
# "nemotron" hace streaming continuo y no usa umbral de energía.)
#   silence_rms = 0    -> autocalibra el piso de ruido al arrancar (recomendado)
#   silence_rms = 350  -> umbral fijo manual (ignora la autocalibración)
silence_rms = 0
auto_calibrate = true   # mide el ruido de fondo en los primeros ~1.5s y fija el umbral

[nemotron]
model = "nvidia/nemotron-3.5-asr-streaming-0.6b"
# Contexto de atención [izq, der]: [56,13]=1120ms (más preciso, recomendado),
# [56,6]=560ms, [56,3]=320ms (más baja latencia, algo menos preciso).
att_context_size = [56, 13]
target_lang = "es"   # "es" fuerza español; "auto" autodetecta el idioma

[asr]
# Glosario de términos/nombres del proyecto para corregir la transcripción (nombres
# propios, jerga). Aplica al engine nemotron. Ej: ["Kubernetes", "Rafael Valdés"].
glossary = []
correct_enabled = true   # corrección post-ASR por similitud contra el glosario (sin LLM)

[context]
# Contexto durable para que el copiloto no pierda el enfoque en llamadas largas.
# briefing: texto fijo (proyecto, participantes, objetivos, términos). Editable también
#   desde la UI (pestaña 📋 Contexto).
briefing = ""
# briefing_file: archivo .txt/.md o carpeta; se lee y RESUME una vez al arrancar y entra
#   al briefing. Ej: "~/proyectos/acme/README.md" o "~/proyectos/acme/docs".
briefing_file = ""
window = 12          # frases en la ventana rodante
summary_every = 8    # cada cuántos finales se actualiza el resumen acumulativo
max_chars = 2000     # presupuesto de caracteres del contexto enviado a Claude

[brain]
# Qué LLM da las sugerencias:
#   "claude" = claude -p (suscripción, sin API key) — mejor calidad
#   "ollama" = LLM local (sin nube) — prueba la velocidad con scripts/derisk_ollama.py
backend = "claude"

[ollama]
# Modelo local (cuando backend="ollama"). En 8GB con el ASR cargado, usa ≤4B.
model = "qwen3.5:9b"
host = "http://127.0.0.1:11434"

[claude]
model = "haiku"

[server]
host = "127.0.0.1"
port = 8765
# Token de acceso a la UI (cámbialo)
token = "cambia-este-token"
